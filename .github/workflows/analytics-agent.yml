# Analytics Agent - Fetch YouTube Stats and Generate Reports
# Runs weekly, fetches YouTube Analytics data, generates performance reports
# Spec: docs/spec/workflows.md#analytics-agentyml
# Agent Spec: docs/spec/AGENT.md

name: Analytics Agent

on:
  schedule:
    # Every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of analytics data to fetch'
        required: false
        default: '28'
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  analyze:
    name: Fetch Analytics & Generate Report
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib
          # Install project dependencies if requirements.txt exists
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      
      - name: Debug Token Scopes
        env:
          YOUTUBE_TOKEN_PICKLE_BRAND: ${{ secrets.YOUTUBE_TOKEN_PICKLE_BRAND }}
        run: |
          echo "🔍 Checking token scopes (brand account)..."
          python -c "import base64; import pickle; import os; token = os.environ.get('YOUTUBE_TOKEN_PICKLE_BRAND'); creds = pickle.loads(base64.b64decode(token)) if token else None; print('Scopes:', creds.scopes if creds else 'No token')"

      - name: Fetch YouTube Analytics
        env:
          YOUTUBE_TOKEN_PICKLE_BRAND: ${{ secrets.YOUTUBE_TOKEN_PICKLE_BRAND }}
        run: |
          echo "📊 Fetching YouTube Analytics..."
          DAYS="${{ inputs.days }}"
          DAYS="${DAYS:-28}"
          python -m agent.fetch_analytics --days "$DAYS"
      
      - name: Generate Weekly Report
        run: |
          echo "📈 Generating performance report..."
          python -m agent.report

      - name: Run Performance Analysis
        run: |
          echo "🔬 Running performance analysis..."
          python scripts/analyze_data.py

      - name: Run ML Correlation
        run: |
          echo "🤖 Running ML correlation analysis..."
          python scripts/correlate.py

      - name: Channel coverage audit
        run: |
          echo "📋 Writing channel coverage audit (read-only)..."
          python scripts/audit_channel.py

      - name: Commit Data
        run: |
          git config user.name "Analytics Agent"
          git config user.email "actions@github.com"

          # Add data files (including suggestions.json)
          git add data/analytics.json data/reports/ data/suggestions.json || true

          # Check if there are changes
          if git diff --staged --quiet; then
            echo "📊 No changes to commit"
          else
            WEEK=$(date +%Y-W%V)
            git commit -m "📊 Analytics update ${WEEK} [skip ci]"
            git push
            echo "✅ Data committed and pushed"
          fi

      - name: Summary
        run: |
          echo "## 📊 Analytics Agent Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f data/analytics.json ]; then
            VIDEO_COUNT=$(python -c "import json; d=json.load(open('data/analytics.json')); print(len(d.get('videos', [])))")
            echo "- **Videos tracked:** $VIDEO_COUNT" >> $GITHUB_STEP_SUMMARY
          fi

          # Add ML suggestions to summary
          if [ -f data/suggestions.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 🤖 ML Suggestions" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Parse suggestions from JSON
            python3 << 'EOF' >> $GITHUB_STEP_SUMMARY
          import json
          with open('data/suggestions.json') as f:
              data = json.load(f)

          print(f"**Overall avg retention:** {data['overall_avg_retention']}%")
          print(f"**Videos analyzed:** {data['videos_with_views']} with views / {data['videos_analyzed']} total")
          print("")

          if not data['suggestions']:
              print("⚠️ No strong patterns yet - need more data")
          else:
              print("| Action | Type | Name | Reason | Confidence |")
              print("|--------|------|------|--------|------------|")
              for s in data['suggestions']:
                  icon = "⬆️" if s['action'] == 'increase' else "⬇️"
                  print(f"| {icon} {s['action']} | {s['type']} | {s['name']} | {s['reason']} | {s['confidence']} |")

          print("")
          print("### Top Performers")
          print("")
          print("| Type | Name | Avg Retention | vs Average |")
          print("|------|------|---------------|------------|")
          for s in data['all_stats'][:10]:
              print(f"| {s['type']} | {s['name']} | {s['avg']:.1f}% | {s['delta']:+.1f}% |")
          EOF
          fi

          # Add report preview
          LATEST_REPORT=$(ls -t data/reports/*.md 2>/dev/null | head -1)
          if [ -n "$LATEST_REPORT" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 📈 Weekly Report Preview" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Latest report:** $LATEST_REPORT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            head -30 "$LATEST_REPORT" >> $GITHUB_STEP_SUMMARY
          fi

