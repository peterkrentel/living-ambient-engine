# Piano Batch - Generate Multiple Piano Videos
# One-time batch generation of piano videos with custom titles
# Generates: 5 unique piano moods (10 total videos with dual mode)
# Spec: docs/spec/workflows.md

name: Piano Batch Generator

on:
  # Manual trigger only
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to YouTube after generation'
        required: false
        type: boolean
        default: true

# Prevent overlapping runs
concurrency:
  group: piano-batch
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

permissions:
  contents: write  # Required for catalog commit

jobs:
  # Job 1: Generate all piano videos
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max for long videos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate piano videos
        run: |
          echo "🎹 Generating piano videos with custom titles..."
          echo "  - piano_ambient @ 2h (DUAL)"
          echo "  - rain_piano @ 2h (DUAL)"
          echo "  - piano_evening @ 1h (DUAL)"
          echo "  - piano_gentle @ 1h (DUAL)"
          echo "  - piano_deep_calm @ 1h (DUAL)"
          echo ""

          # Batch 1: 2-hour videos (creates initial manifest)
          echo "📹 Batch 1/2: Generating 2-hour videos..."
          python batch_generate.py \
            --moods piano_ambient,rain_piano \
            --durations 2h \
            --dual \
            --output ./generated

          # Batch 2: 1-hour videos (appends to manifest)
          echo ""
          echo "📹 Batch 2/2: Generating 1-hour videos..."
          python batch_generate.py \
            --moods piano_evening,piano_gentle,piano_deep_calm \
            --durations 1h \
            --dual \
            --output ./generated \
            --append-manifest

      - name: Validate generated files
        run: |
          echo "🔍 Validating generated files..."
          test -f ./generated/manifest.json || { echo "❌ manifest.json missing"; exit 1; }

          # Check file sizes
          for f in ./generated/*.mp4; do
            [ -f "$f" ] || continue
            SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            if [ "$SIZE" -lt 1000 ]; then
              echo "❌ File too small: $f ($SIZE bytes)"
              exit 1
            fi
            echo "✅ $f: $SIZE bytes"
          done

          # Verify video duration with ffprobe
          for f in ./generated/*.mp4; do
            [ -f "$f" ] || continue
            DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f" | cut -d. -f1)
            echo "✅ $f: ${DURATION}s"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piano-videos
          path: ./generated/
          retention-days: 7

      - name: Generation summary
        run: |
          echo "## 🎹 Piano Videos Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat ./generated/manifest.json | python -c "
          import sys, json
          data = json.load(sys.stdin)
          dual = data.get('dual_mode', False)
          print(f\"- Mode: {'DUAL (Ambience + Melody)' if dual else 'Single'}\")
          print(f\"- Jobs: {data.get('total_jobs', data.get('total', 0))}\")
          print(f\"- Success: {data.get('successful_jobs', data.get('success', 0))}\")
          print(f\"- Total Videos: {data.get('total_videos', 0)}\")
          print(f\"\")
          print(f\"### Videos:\")
          for v in data.get('videos', []):
              title = v.get('video_title', v.get('result', {}).get('video_title', 'Unknown'))
              print(f\"  - {title}\")
          "

  # Job 2: Upload to YouTube
  upload:
    needs: generate
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.upload == true || github.event.inputs.upload == 'true' }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth-oauthlib google-api-python-client

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: piano-videos
          path: ./generated

      - name: Restore YouTube credentials
        run: |
          printf "%s" "${{ secrets.YOUTUBE_TOKEN_PICKLE }}" | base64 -d > youtube_token.pickle
          printf "%s" '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > client_secrets.json

      - name: Upload to YouTube
        run: |
          python youtube_upload.py --batch ./generated --catalog-channel personal

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f youtube_token.pickle client_secrets.json

      - name: Commit catalog updates
        run: |
          git config user.name "Piano Batch Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add catalog files if they exist
          if [ -f content_catalog.json ]; then
            git add content_catalog.json
          fi
          if [ -f CONTENT_LIBRARY.md ]; then
            git add CONTENT_LIBRARY.md
          fi
          if [ -f data/generations.json ]; then
            git add data/generations.json
          fi

          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No catalog or generations ledger changes to commit"
          else
            git commit -m "🎹 Update content library / generations ledger (piano) [automated]"
            git push
            echo "✅ Catalog updated and pushed to repository"
          fi

      - name: Upload summary
        run: |
          echo "## ✅ YouTube Upload Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All piano videos uploaded successfully!" >> $GITHUB_STEP_SUMMARY

  notify:
    needs: [generate, upload]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send notification
        run: |
          echo "🎹 Piano Batch completed"
          echo "  - Generate: ${{ needs.generate.result }}"
          echo "  - Upload: ${{ needs.upload.result }}"

