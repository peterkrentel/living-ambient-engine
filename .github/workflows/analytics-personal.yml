# Personal-channel analytics (separate experiment from brand)
# Spec: docs/spec/workflows.md#analytics-personalyml
# See: docs/PERSONAL_ANALYTICS.md

name: Analytics Agent (Personal)

on:
  schedule:
    # Monday 02:00 UTC — offset from brand Sunday run to avoid accidental coupling
    - cron: '0 2 * * 1'

  workflow_dispatch:
    inputs:
      days:
        description: 'Days of analytics data to fetch'
        required: false
        default: '28'
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  # Never set YOUTUBE_TOKEN_PICKLE_BRAND in this workflow — personal fetch must not see it.

jobs:
  analyze-personal:
    name: Fetch Personal Analytics & Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Debug token scopes (personal)
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          echo "🔍 Checking token scopes (personal account)..."
          python -c "import base64, pickle, os; t=os.environ.get('YOUTUBE_TOKEN_PICKLE'); c=pickle.loads(base64.b64decode(t)) if t else None; print('Scopes:', c.scopes if c else 'No token')"

      - name: Fetch YouTube Analytics (personal)
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          echo "📊 Fetching personal-channel YouTube Analytics..."
          DAYS="${{ inputs.days }}"
          DAYS="${DAYS:-28}"
          python -m agent.fetch_analytics --channel personal --days "$DAYS"

      - name: Generate weekly report (personal)
        env:
          ANALYTICS_JSON_PATH: data/analytics_personal.json
          ANALYTICS_CHANNEL: personal
          ANALYTICS_REPORT_SUFFIX: '-personal'
        run: |
          echo "📈 Generating personal performance report..."
          python -m agent.report

      - name: Run performance analysis (personal)
        env:
          ANALYTICS_JSON_PATH: data/analytics_personal.json
        run: |
          echo "🔬 Running performance analysis (personal snapshot)..."
          python scripts/analyze_data.py

      - name: Channel coverage audit (personal)
        env:
          ANALYTICS_JSON_PATH: data/analytics_personal.json
          ANALYTICS_CHANNEL: personal
          ANALYTICS_REPORT_SUFFIX: '-personal'
        run: |
          echo "📋 Writing personal channel coverage audit..."
          python scripts/audit_channel.py

      - name: Run ML correlation (personal)
        env:
          ANALYTICS_JSON_PATH: data/analytics_personal.json
          SUGGESTIONS_JSON_PATH: data/suggestions_personal.json
        run: |
          echo "🤖 Running personal-channel correlation (separate JSON from brand)..."
          python scripts/correlate.py

      - name: Plan run intent (personal, gated)
        run: |
          echo "🧭 Planning personal run intent from suggestions_personal.json (no upload)..."
          python scripts/plan_run_intent.py \
            --suggestions data/suggestions_personal.json \
            --channel personal \
            --intent-output data/run_intent_personal.json \
            --blocked-output data/reports/run-intent-blocked-personal.md

      - name: Run-next advisory personal (deterministic v0)
        run: |
          echo "🧭 Writing personal run-next markdown..."
          python scripts/run_next_report.py --lane personal

      - name: Cache runner GGUF (dual advisory)
        uses: actions/cache@v4
        with:
          path: ~/.cache/living-agent
          key: living-agent-gguf-qwen25-15b-q4-${{ runner.os }}-v2

      - name: Dual LLM advisory personal (Gemini + runner GGUF, parallel)
        env:
          # Personal Google AI project key — separate secret name from brand (`GEMINI_API_KEY`).
          GEMINI_API_KEY_PERSONAL: ${{ secrets.GEMINI_API_KEY_PERSONAL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Free tier on small AI Studio projects is often ~5 RPM / low RPD for Flash — pace requests
          # and cap retries (see docs/spec/workflows.md § analytics-personal).
          GEMINI_MIN_INTERVAL_SEC: "15"
          GEMINI_MAX_RETRIES: "2"
          GEMINI_429_MIN_SLEEP_SEC: "20"
        run: |
          set -euo pipefail
          pip install 'llama-cpp-python>=0.2.90,<0.4'
          WEEK=$(python -c "from datetime import datetime, timezone; n=datetime.now(timezone.utc); y,w,_=n.isocalendar(); print(f'{y}-W{w:02d}')")
          echo "::group::Dual advisory (personal week=$WEEK)"
          echo "Runner logs are prefixed with [runner-advisory] in script output below."
          python scripts/agent_dual_advisory.py --lane personal --week "$WEEK"
          echo "::endgroup::"

      - name: Commit personal data
        run: |
          git config user.name "Analytics Agent (Personal)"
          git config user.email "actions@github.com"

          # Stage all generated artifacts so git pull --rebase never fails due to a dirty tree.
          git add data/ data/reports/ || true

          if git diff --staged --quiet; then
            echo "📊 No personal analytics changes to commit"
          else
            WEEK=$(date +%Y-W%V)
            git commit -m "📊 Personal analytics ${WEEK} [skip ci]"
            # main may advance during this job (e.g. brand analytics); merge + union-resolve data conflicts.
            bash scripts/ci_merge_main_after_data_commit.sh
            echo "✅ Personal analytics committed and pushed"
          fi

      - name: Summary
        run: |
          echo "## Personal channel — Analytics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Experiment:** Personal only. Brand pipeline is unchanged (\`analytics-agent.yml\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/analytics_personal.json ]; then
            VC=$(python -c "import json; d=json.load(open('data/analytics_personal.json')); print(len(d.get('videos', [])))")
            echo "- **Videos in \`analytics_personal.json\`:** $VC" >> "$GITHUB_STEP_SUMMARY"
          fi
          LATEST=$(ls -t data/reports/*-personal.md 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Latest personal report:** \`$LATEST\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            head -25 "$LATEST" >> "$GITHUB_STEP_SUMMARY"
          fi
