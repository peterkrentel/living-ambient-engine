# Content Factory (Brand Channel) - Living Ambient Engine
# Generates ambient videos and publishes to the brand YouTube channel
# Spec: docs/spec/workflows.md#content-factory-brandyml

name: Content Factory (Brand)

on:
  # Manual trigger only (no schedule - you control when to post)
  workflow_dispatch:
    inputs:
      moods:
        description: 'Moods (comma-separated). VALID: rain_sleep, ocean_waves, fireplace, forest_morning, deep_focus, sleep, chill, study, energize, lofi_study, piano_relax, warrior, ceremony, trance. Or use: all'
        required: false
        default: 'rain_sleep,deep_focus,ocean_waves'
      duration:
        description: 'Duration. VALID: 30s, 10min, 1h, 3h, 4h (max)'
        required: false
        type: choice
        default: '1h'
        options:
          - '30s'
          - '10min'
          - '1h'
          - '3h'
          - '4h'
      dual:
        description: 'Generate BOTH ambience-only and melody versions (2x videos)'
        required: false
        type: boolean
        default: true
      upload:
        description: 'Upload to YouTube after generation'
        required: false
        type: boolean
        default: true

# Prevent overlapping long runs
concurrency:
  group: content-factory-brand
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

permissions:
  contents: write  # Required for catalog commit

jobs:
  # Job 1: Generate videos and upload as artifacts
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max for long videos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate videos
        env:
          DUAL: ${{ github.event.inputs.dual }}
        run: |
          DUAL_FLAG=""
          if [ "$DUAL" = "true" ] || [ "$DUAL" = "True" ] || [ "$DUAL" = "1" ]; then
            DUAL_FLAG="--dual"
          fi
          python batch_generate.py \
            --moods "${{ github.event.inputs.moods || 'rain_sleep,deep_focus,ocean_waves' }}" \
            --durations "${{ github.event.inputs.duration || '1h' }}" \
            $DUAL_FLAG \
            --output ./generated

      - name: Validate generated files
        run: |
          echo "🔍 Validating generated files..."
          test -f ./generated/manifest.json || { echo "❌ manifest.json missing"; exit 1; }

          # Check file sizes
          for f in ./generated/*.mp4; do
            [ -f "$f" ] || continue
            SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            if [ "$SIZE" -lt 1000 ]; then
              echo "❌ File too small: $f ($SIZE bytes)"
              exit 1
            fi
            echo "✅ $f: $SIZE bytes"
          done

          # Verify video duration with ffprobe
          for f in ./generated/*.mp4; do
            [ -f "$f" ] || continue
            DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f" | cut -d. -f1)
            echo "✅ $f: ${DURATION}s"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos-brand
          path: ./generated/
          retention-days: 7

      - name: Generation summary
        run: |
          echo "## 🎬 Generation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat ./generated/manifest.json | python -c "
          import sys, json
          data = json.load(sys.stdin)
          dual = data.get('dual_mode', False)
          print(f\"- Mode: {'DUAL (Ambience + Melody)' if dual else 'Single'}\")
          print(f\"- Jobs: {data.get('total_jobs', data.get('total', 0))}\")
          print(f\"- Success: {data.get('successful_jobs', data.get('success', 0))}\")
          print(f\"- Total Videos: {data.get('total_videos', 0)}\")
          for v in data.get('videos', []):
              title = v.get('video_title', v.get('result', {}).get('video_title', 'Unknown'))
              print(f\"  - {title}\")
          "

  # Job 2: Download artifacts and upload to YouTube
  upload:
    needs: generate
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.upload == true || github.event.inputs.upload == 'true' }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth-oauthlib google-api-python-client

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-videos-brand
          path: ./generated

      - name: Restore YouTube credentials (Brand Channel)
        run: |
          printf "%s" "${{ secrets.YOUTUBE_TOKEN_PICKLE_BRAND }}" | base64 -d > youtube_token.pickle
          printf "%s" '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > client_secrets.json

      - name: Upload to YouTube (Brand Channel)
        run: |
          python youtube_upload.py --batch ./generated

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f youtube_token.pickle client_secrets.json

      - name: Commit catalog updates
        run: |
          git config user.name "Content Factory Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add catalog files if they exist
          if [ -f content_catalog.json ]; then
            git add content_catalog.json
          fi
          if [ -f CONTENT_LIBRARY.md ]; then
            git add CONTENT_LIBRARY.md
          fi
          if [ -f data/generations.json ]; then
            git add data/generations.json
          fi

          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No catalog or generations ledger changes to commit"
          else
            git commit -m "📚 Update content library and generations ledger [automated]"
            # main may advance during this job (e.g. analytics or personal lane); rebase then push
            git pull --rebase origin main
            git push
            echo "✅ Catalog updated and pushed to repository"
          fi

      - name: Upload summary
        run: |
          echo "## ✅ YouTube Upload Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Channel:** Living Ambient Engine (Brand)" >> $GITHUB_STEP_SUMMARY

          # Catalog stats = rows in repo JSON only (uploads through this engine), not full YouTube channel size.
          if [ -f content_catalog.json ]; then
            echo "### Repo catalog (\`content_catalog.json\`)" >> $GITHUB_STEP_SUMMARY
            echo "_Pipeline log only — can be far below total videos on the channel._" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if python library_cli.py stats > /tmp/catalog_stats.txt 2>&1; then
              tail -n +2 /tmp/catalog_stats.txt >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️  Catalog stats unavailable" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  notify:
    needs: [generate, upload]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send notification
        run: |
          echo "Content Factory (Brand) completed"
          echo "  - Generate: ${{ needs.generate.result }}"
          echo "  - Upload: ${{ needs.upload.result }}"

