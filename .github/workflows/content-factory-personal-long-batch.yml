# Personal long-form pressure batch — 24×1h from data/personal_long_batch_pressure_v1.json
# 6 slots/day × 4 days (interleaved moods). State: data/personal_long_batch_pressure_state.json
# Daily 09:00 UTC: pick → generate → upload (like brand batch); stops when state completed. Staggered vs brand micro 08:00 UTC.
# GitHub-hosted jobs are capped at 6h — six 1h renders may need a larger runner or local generation; see docs/spec/workflows.md
# Spec: docs/spec/workflows.md#content-factory-personal-long-batchyml

name: Content Factory Personal Long Batch (Pressure v1)

on:
  schedule:
    - cron: "0 9 * * *" # Daily 09:00 UTC; upload when generation succeeds (pause by removing schedule block)

  workflow_dispatch:
    inputs:
      day_override:
        description: "Day 1–4 (optional). Empty = use data/personal_long_batch_pressure_state.json next_day"
        required: false
        default: ""
      reset_state:
        description: "Reset progress file to day 1 (dispatch only)"
        required: false
        type: boolean
        default: false
      run_full_batch:
        description: "If true, generate all 24 in one run (ignores daily state)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run — plan only, no video generation"
        required: false
        type: boolean
        default: false
      upload:
        description: "workflow_dispatch: require true to upload after generation. Scheduled runs upload automatically when generation succeeds."
        required: false
        type: boolean
        default: false

concurrency:
  group: personal-long-batch-pressure-v1
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: write
  actions: read

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      day_num: ${{ steps.pick.outputs.day_num }}
      should_run: ${{ steps.pick.outputs.should_run }}
      advance_state: ${{ steps.pick.outputs.advance_state }}

    steps:
      - uses: actions/checkout@v4

      - name: Reset personal long batch progress
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.reset_state == true || github.event.inputs.reset_state == 'true') }}
        run: |
          python3 scripts/run_personal_long_batch.py --reset-state --state-file data/personal_long_batch_pressure_state.json
          git config user.name "Content Factory Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/personal_long_batch_pressure_state.json
          if git diff --staged --quiet; then
            echo "State already at initial values"
          else
            git commit -m "Reset personal long batch pressure state [automated]"
            bash scripts/ci_merge_main_after_data_commit.sh || true
          fi

      - name: Pick day / mode
        id: pick
        env:
          DAY_OVERRIDE: ${{ github.event.inputs.day_override }}
          PICK_DRY_RUN: ${{ github.event.inputs.dry_run }}
          RUN_FULL_BATCH: ${{ github.event.inputs.run_full_batch }}
        run: python3 scripts/run_personal_long_batch.py --pick-for-ci --state-file data/personal_long_batch_pressure_state.json

      - name: Pick summary
        run: |
          echo "## Personal long batch (pressure v1) — pick" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**mode:** ${{ steps.pick.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**day_num:** ${{ steps.pick.outputs.day_num }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**should_run:** ${{ steps.pick.outputs.should_run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**advance_state:** ${{ steps.pick.outputs.advance_state }}" >> "$GITHUB_STEP_SUMMARY"

  generate:
    needs: pick
    if: ${{ needs.pick.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Plan (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run == true || github.event.inputs.dry_run == 'true') }}
        run: |
          MODE="${{ needs.pick.outputs.mode }}"
          if [ "$MODE" = "all" ]; then
            python scripts/run_personal_long_batch.py --dry-run --output ./generated --mode all | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python scripts/run_personal_long_batch.py --dry-run --output ./generated --mode daily --day "${{ needs.pick.outputs.day_num }}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate personal long batch
        if: ${{ github.event_name == 'schedule' || (github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true') }}
        run: |
          MODE="${{ needs.pick.outputs.mode }}"
          if [ "$MODE" = "all" ]; then
            python scripts/run_personal_long_batch.py --output ./generated --mode all
          else
            python scripts/run_personal_long_batch.py --output ./generated --mode daily --day "${{ needs.pick.outputs.day_num }}"
          fi

      - name: Commit batch progress
        if: >-
          success()
          && needs.pick.outputs.advance_state == 'true'
          && (github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true')
        run: |
          python3 scripts/run_personal_long_batch.py --advance-day "${{ needs.pick.outputs.day_num }}" --state-file data/personal_long_batch_pressure_state.json
          git config user.name "Content Factory Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/personal_long_batch_pressure_state.json
          if git diff --staged --quiet; then
            echo "No state file changes to commit"
          else
            git commit -m "Advance personal long batch pressure state [automated]"
            bash scripts/ci_merge_main_after_data_commit.sh || true
          fi

      - name: Upload artifacts
        if: ${{ github.event_name == 'schedule' || (github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: personal-long-batch-pressure-v1
          path: ./generated/
          retention-days: 7

      - name: Generation summary
        if: ${{ github.event_name == 'schedule' || (github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true') }}
        run: |
          echo "## Personal long batch pressure v1 — generate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**mode:** ${{ needs.pick.outputs.mode }} **day:** ${{ needs.pick.outputs.day_num }}" >> "$GITHUB_STEP_SUMMARY"
          test -f ./generated/manifest.json && python -c "import json; d=json.load(open('./generated/manifest.json')); print('**Videos (manifest total):**', d.get('total_videos'))" >> "$GITHUB_STEP_SUMMARY" || true

  upload:
    needs: [pick, generate]
    runs-on: ubuntu-latest
    if: >-
      ${{
        needs.pick.outputs.should_run == 'true'
        && needs.generate.result == 'success'
        && (
          github.event_name == 'schedule'
          || (
            github.event_name == 'workflow_dispatch'
            && github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true'
            && (github.event.inputs.upload == true || github.event.inputs.upload == 'true')
          )
        )
      }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth-oauthlib google-api-python-client

      - uses: actions/download-artifact@v4
        with:
          name: personal-long-batch-pressure-v1
          path: ./generated

      - name: Restore YouTube credentials
        run: |
          printf "%s" "${{ secrets.YOUTUBE_TOKEN_PICKLE }}" | base64 -d > youtube_token.pickle
          printf "%s" '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > client_secrets.json

      - name: Upload to YouTube (personal)
        run: |
          python youtube_upload.py --batch ./generated --catalog-channel personal

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f youtube_token.pickle client_secrets.json

      - name: Commit generations ledger
        run: |
          git config user.name "Content Factory Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/generations.json ]; then
            git add data/generations.json
          fi
          if git diff --staged --quiet; then
            echo "No generations ledger changes to commit"
          else
            git commit -m "Update generations ledger (personal long batch pressure v1) [automated]"
            bash scripts/ci_merge_main_after_data_commit.sh || true
          fi
