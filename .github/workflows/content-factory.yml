# Content Factory - Automated Video Generation & Upload
# Generates ambient videos and publishes to YouTube on schedule

name: Content Factory

on:
  # Run daily at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'
  
  # Manual trigger with options
  workflow_dispatch:
    inputs:
      moods:
        description: 'Moods to generate (comma-separated or "all")'
        required: false
        default: 'deep_focus,sleep,trance'
      durations:
        description: 'Durations (e.g., "1h,2h")'
        required: false
        default: '1h'
      upload:
        description: 'Upload to YouTube after generation'
        required: false
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max for long videos
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth-oauthlib google-api-python-client
      
      - name: Generate videos
        run: |
          python batch_generate.py \
            --moods "${{ github.event.inputs.moods || 'deep_focus,sleep,trance' }}" \
            --durations "${{ github.event.inputs.durations || '1h' }}" \
            --output ./generated
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: ./generated/
          retention-days: 7
      
      - name: Restore YouTube credentials
        if: ${{ github.event.inputs.upload == 'true' || github.event_name == 'schedule' }}
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN_PICKLE }}" | base64 -d > youtube_token.pickle
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > client_secrets.json

      - name: Upload to YouTube
        if: ${{ github.event.inputs.upload == 'true' || github.event_name == 'schedule' }}
        run: |
          python youtube_upload.py --batch ./generated
      
      - name: Summary
        run: |
          echo "## Content Factory Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Videos:" >> $GITHUB_STEP_SUMMARY
          cat ./generated/manifest.json | python -c "
          import sys, json
          data = json.load(sys.stdin)
          print(f\"- Total: {data['total']}\")
          print(f\"- Success: {data['success']}\")
          for v in data.get('videos', []):
              r = v.get('result', {})
              print(f\"  - {r.get('video_title', 'Unknown')}\")
          "

  # Optional: Notify on completion
  notify:
    needs: generate
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Send notification
        run: |
          echo "Content Factory completed with status: ${{ needs.generate.result }}"
          # Add Discord/Slack webhook here if desired

