# Art Creator - Parameterized Artistic Video Generation
# An artist's palette for creating unique ambient videos
# Inspired by the premise that anyone can be an artist with the right tools
# Spec: docs/spec/workflows.md#art-creatoryml

name: Art Creator

on:
  # Manual trigger - OPEN TO PUBLIC
  # Anyone can run this workflow with their own artistic choices
  workflow_dispatch:
    inputs:
      # ===== ART HISTORICAL PERIOD =====
      art_period:
        description: 'Art Historical Period (visual inspiration)'
        required: false
        type: choice
        default: 'modern'
        options:
          - 'cave_art'           # Prehistoric cave paintings
          - 'ancient'            # Ancient civilizations (Egypt, Greece, Rome)
          - 'medieval'           # Medieval illuminated manuscripts
          - 'renaissance'        # Renaissance masters
          - 'baroque'            # Baroque drama and movement
          - 'impressionist'      # Impressionist light and color
          - 'modern'             # Modern abstract art
          - 'contemporary'       # Contemporary mixed media
          - 'future'             # Futuristic digital art
      
      # ===== VISUAL PARAMETERS =====
      visual_pattern:
        description: 'Visual Pattern Type (auto = inherit from art period)'
        required: false
        type: choice
        default: 'auto'
        options:
          - 'auto'               # Inherit from art period
          - 'fractal_zoom'       # Mandelbrot/Julia set zoom
          - 'mandelbrot'         # Mandelbrot fractal
          - 'julia'              # Julia set fractal
          - 'fibonacci_spiral'   # Golden ratio spiral
          - 'sacred_geometry'    # Flower of Life, Metatron's Cube
          - 'particle_flow'      # Flowing organic particles
          - 'organic_flow'       # Organic flowing patterns
          - 'geometric_morph'    # Morphing geometric shapes
          - 'platonic_solids'    # 3D geometric solids
          - 'slow_waves'         # Sine wave patterns
          - 'flowing_waves'      # Wave patterns
          - 'starfield'          # Starfield space journey
          - 'rain_window'        # Rain on window
          - 'fireplace'          # Flickering fireplace
      
      visual_speed:
        description: 'Visual Speed (auto=from art period, or 0.1=very slow to 1.0=fast)'
        required: false
        default: 'auto'

      visual_complexity:
        description: 'Visual Complexity (auto=from art period, or 0.1=simple to 1.0=intricate)'
        required: false
        default: 'auto'
      
      color_palette:
        description: 'Color Palette (auto = inherit from art period)'
        required: false
        type: choice
        default: 'auto'
        options:
          - 'auto'               # Inherit from art period
          - 'cave_earth'         # Earth tones (browns, ochres)
          - 'ancient_gold'       # Gold and jewel tones
          - 'medieval_rich'      # Deep reds, blues, gold
          - 'renaissance_warm'   # Warm, natural tones
          - 'impressionist_soft' # Soft, pastel colors
          - 'psychedelic'        # Vibrant, electric colors
          - 'cyberpunk'          # Neon and dark contrasts
          - 'sunset'             # Personal sunset photography tones
          - 'ocean'              # Deep blues and teals
          - 'forest'             # Greens and earth
          - 'custom'             # Use custom RGB values
      
      # Custom colors (used when color_palette='custom')
      custom_primary_rgb:
        description: 'Custom Primary Color (R,G,B e.g., "100,150,200")'
        required: false
        default: '100,150,200'
      
      custom_secondary_rgb:
        description: 'Custom Secondary Color (R,G,B e.g., "200,100,150")'
        required: false
        default: '200,100,150'
      
      custom_accent_rgb:
        description: 'Custom Accent Color (R,G,B e.g., "255,255,100")'
        required: false
        default: '255,255,100'
      
      # ===== AUDIO PARAMETERS =====
      music_style:
        description: 'Music Style / Rhythm Pattern'
        required: false
        type: choice
        default: 'gnawa'
        options:
          - 'heartbeat'          # Primal heartbeat
          - 'taiko'              # Japanese ceremonial drums
          - 'gamelan'            # Indonesian ethereal percussion
          - 'gnawa'              # Moroccan spiritual trance
          - 'bamboula'           # Caribbean hypnotic groove
          - 'candomble'          # Brazilian sacred polyrhythms
          - 'burundi'            # East African power drums
          - 'kuku'               # West African celebration
          - 'none'               # No percussion (pure ambient)
      
      tempo:
        description: 'Tempo / Rhythm Speed (40=very slow, 120=fast)'
        required: false
        default: '60'
      
      brainwave_frequency:
        description: 'Brainwave Frequency Hz (2=sleep, 10=relax, 40=focus)'
        required: false
        default: '10'
      
      solfeggio_frequency:
        description: 'Solfeggio Healing Frequency Hz'
        required: false
        type: choice
        default: '528'
        options:
          - '174'  # Pain reduction
          - '285'  # Natural healing
          - '396'  # Liberation from fear
          - '417'  # Facilitating change
          - '528'  # Transformation and miracles (DNA repair)
          - '639'  # Connection and relationships
          - '741'  # Awakening intuition
          - '852'  # Spiritual order
          - '963'  # Divine consciousness
      
      rhythm_volume:
        description: 'Rhythm/Drums Volume (0.0=off, 1.0=full)'
        required: false
        default: '0.5'
      
      ambient_volume:
        description: 'Ambient/Drone Volume (0.0=off, 1.0=full)'
        required: false
        default: '1.0'
      
      # ===== DYNAMICS / JOURNEY =====
      journey:
        description: 'Dynamic Journey (how tempo/visuals evolve over time)'
        required: false
        type: choice
        default: 'steady'
        options:
          - 'steady'      # Constant tempo and visuals (traditional)
          - 'awakening'   # Gradual rise from stillness to energy
          - 'deep_dive'   # Descending into calm (sleep prep)
          - 'breathing'   # Rhythmic oscillation (breathing sync)
          - 'crescendo'   # Build to peak then release
          - 'trance'      # Slow build with hypnotic repetition
          - 'waves'       # Long slow swells like ocean waves

      journey_intensity:
        description: 'Journey Intensity (how dramatic the changes are)'
        required: false
        type: choice
        default: 'moderate'
        options:
          - 'subtle'      # ±20% variation
          - 'moderate'    # ±40% variation
          - 'dramatic'    # ±60% variation

      # ===== GENERATION PARAMETERS =====
      duration:
        description: 'Duration (max 4h per guardrails)'
        required: false
        type: choice
        default: '5min'
        options:
          - '30s'
          - '5min'
          - '10min'
          - '1h'
          - '3h'
          - '4h'
      
      seed:
        description: 'Random Seed (for reproducibility, leave empty for random)'
        required: false
        default: ''
      
      title:
        description: 'Custom Video Title (optional, auto-generated if empty)'
        required: false
        default: ''
      
      description:
        description: 'Custom Video Description (optional)'
        required: false
        default: ''
      
      upload_to_brand:
        description: 'Upload to Brand YouTube Channel'
        required: false
        type: boolean
        default: false

  # Called by test-art-creator.yml with specific inputs
  workflow_call:
    inputs:
      art_period:
        type: string
        required: false
        default: 'modern'
      visual_pattern:
        type: string
        required: false
        default: 'auto'
      visual_speed:
        type: string
        required: false
        default: 'auto'
      visual_complexity:
        type: string
        required: false
        default: 'auto'
      color_palette:
        type: string
        required: false
        default: 'auto'
      music_style:
        type: string
        required: false
        default: 'gnawa'
      tempo:
        type: string
        required: false
        default: '60'
      brainwave_frequency:
        type: string
        required: false
        default: '10'
      solfeggio_frequency:
        type: string
        required: false
        default: '528'
      rhythm_volume:
        type: string
        required: false
        default: '0.5'
      ambient_volume:
        type: string
        required: false
        default: '1.0'
      duration:
        type: string
        required: false
        default: '5min'
      journey:
        type: string
        required: false
        default: 'steady'
      journey_intensity:
        type: string
        required: false
        default: 'moderate'
      test_id:
        type: string
        required: false
        default: ''
        description: 'Test identifier for artifact naming'
      skip_artifact_upload:
        type: string
        required: false
        default: 'false'
        description: 'Skip artifact upload for faster tests'
      upload_to_brand:
        type: boolean
        required: false
        default: false
        description: 'Upload to Brand YouTube Channel'

# Prevent overlapping runs and resource contention
# Include test_id to allow parallel matrix jobs from test-art-creator.yml
concurrency:
  group: art-creator-${{ github.run_id }}-${{ inputs.test_id || 'manual' }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

permissions:
  contents: read
  actions: read

jobs:
  # =============================================================================
  # SINGLE JOB - Works for both manual (workflow_dispatch) and test (workflow_call)
  # =============================================================================
  create_art:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 hours for 4h video generation + processing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set input values
        id: inputs
        run: |
          # For workflow_call: use inputs.X
          # For workflow_dispatch: use github.event.inputs.X
          # Fallback to defaults if neither provided
          echo "art_period=${{ inputs.art_period || github.event.inputs.art_period || 'modern' }}" >> $GITHUB_OUTPUT
          echo "visual_pattern=${{ inputs.visual_pattern || github.event.inputs.visual_pattern || 'auto' }}" >> $GITHUB_OUTPUT
          echo "visual_speed=${{ inputs.visual_speed || github.event.inputs.visual_speed || 'auto' }}" >> $GITHUB_OUTPUT
          echo "visual_complexity=${{ inputs.visual_complexity || github.event.inputs.visual_complexity || 'auto' }}" >> $GITHUB_OUTPUT
          echo "color_palette=${{ inputs.color_palette || github.event.inputs.color_palette || 'auto' }}" >> $GITHUB_OUTPUT
          echo "music_style=${{ inputs.music_style || github.event.inputs.music_style || 'gnawa' }}" >> $GITHUB_OUTPUT
          echo "tempo=${{ inputs.tempo || github.event.inputs.tempo || '60' }}" >> $GITHUB_OUTPUT
          echo "brainwave_frequency=${{ inputs.brainwave_frequency || github.event.inputs.brainwave_frequency || '10' }}" >> $GITHUB_OUTPUT
          echo "solfeggio_frequency=${{ inputs.solfeggio_frequency || github.event.inputs.solfeggio_frequency || '528' }}" >> $GITHUB_OUTPUT
          echo "rhythm_volume=${{ inputs.rhythm_volume || github.event.inputs.rhythm_volume || '0.5' }}" >> $GITHUB_OUTPUT
          echo "ambient_volume=${{ inputs.ambient_volume || github.event.inputs.ambient_volume || '1.0' }}" >> $GITHUB_OUTPUT
          echo "duration=${{ inputs.duration || github.event.inputs.duration || '5min' }}" >> $GITHUB_OUTPUT
          echo "seed=${{ github.event.inputs.seed || '' }}" >> $GITHUB_OUTPUT
          echo "title=${{ github.event.inputs.title || '' }}" >> $GITHUB_OUTPUT
          echo "description=${{ github.event.inputs.description || '' }}" >> $GITHUB_OUTPUT
          # Boolean inputs - handle both workflow_dispatch (string) and workflow_call (boolean)
          echo "upload_to_brand=${{ inputs.upload_to_brand || github.event.inputs.upload_to_brand || 'false' }}" >> $GITHUB_OUTPUT
          echo "custom_primary_rgb=${{ github.event.inputs.custom_primary_rgb || '100,150,200' }}" >> $GITHUB_OUTPUT
          echo "custom_secondary_rgb=${{ github.event.inputs.custom_secondary_rgb || '200,100,150' }}" >> $GITHUB_OUTPUT
          echo "custom_accent_rgb=${{ github.event.inputs.custom_accent_rgb || '255,255,100' }}" >> $GITHUB_OUTPUT
          echo "journey=${{ inputs.journey || github.event.inputs.journey || 'steady' }}" >> $GITHUB_OUTPUT
          echo "journey_intensity=${{ inputs.journey_intensity || github.event.inputs.journey_intensity || 'moderate' }}" >> $GITHUB_OUTPUT
          echo "test_id=${{ inputs.test_id || '' }}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Validate inputs
        run: |
          # Validate numeric inputs are in valid ranges
          python3 << 'PYTHON_VALIDATION'
          import sys
          
          def validate_float(name, value, min_val, max_val):
              try:
                  val = float(value)
                  if val < min_val or val > max_val:
                      print(f"❌ Error: {name} must be between {min_val} and {max_val}, got {val}")
                      return False
                  return True
              except ValueError:
                  print(f"❌ Error: {name} must be a valid number, got '{value}'")
                  return False
          
          def validate_int(name, value, min_val, max_val):
              try:
                  val = int(value)
                  if val < min_val or val > max_val:
                      print(f"❌ Error: {name} must be between {min_val} and {max_val}, got {val}")
                      return False
                  return True
              except ValueError:
                  print(f"❌ Error: {name} must be a valid integer, got '{value}'")
                  return False
          
          def validate_float_or_auto(name, value, min_val, max_val):
              if value == 'auto':
                  return True
              return validate_float(name, value, min_val, max_val)

          valid = True
          valid &= validate_float_or_auto("visual_speed", "${{ steps.inputs.outputs.visual_speed }}", 0.01, 1.5)
          valid &= validate_float_or_auto("visual_complexity", "${{ steps.inputs.outputs.visual_complexity }}", 0.1, 1.0)
          valid &= validate_int("tempo", "${{ steps.inputs.outputs.tempo }}", 20, 200)
          valid &= validate_int("brainwave_frequency", "${{ steps.inputs.outputs.brainwave_frequency }}", 1, 50)
          valid &= validate_float("rhythm_volume", "${{ steps.inputs.outputs.rhythm_volume }}", 0.0, 1.0)
          valid &= validate_float("ambient_volume", "${{ steps.inputs.outputs.ambient_volume }}", 0.0, 1.0)
          
          if not valid:
              sys.exit(1)
          
          print("✅ All input parameters are valid")
          PYTHON_VALIDATION
      
      - name: Generate custom configuration
        env:
          ART_PERIOD: ${{ steps.inputs.outputs.art_period }}
          VISUAL_PATTERN: ${{ steps.inputs.outputs.visual_pattern }}
          VISUAL_SPEED: ${{ steps.inputs.outputs.visual_speed }}
          VISUAL_COMPLEXITY: ${{ steps.inputs.outputs.visual_complexity }}
          MUSIC_STYLE: ${{ steps.inputs.outputs.music_style }}
          RHYTHM_VOLUME: ${{ steps.inputs.outputs.rhythm_volume }}
          BRAINWAVE_FREQ: ${{ steps.inputs.outputs.brainwave_frequency }}
          SOLFEGGIO_FREQ: ${{ steps.inputs.outputs.solfeggio_frequency }}
          TEMPO: ${{ steps.inputs.outputs.tempo }}
          JOURNEY: ${{ steps.inputs.outputs.journey }}
          JOURNEY_INTENSITY: ${{ steps.inputs.outputs.journey_intensity }}
          TITLE_INPUT: ${{ steps.inputs.outputs.title }}
        run: |
          # Create a custom configuration file based on workflow inputs using env vars
          # Handle 'none' rhythm by setting it to null
          RHYTHM_VALUE="$MUSIC_STYLE"
          if [ "$RHYTHM_VALUE" = "none" ]; then
            RHYTHM_VALUE="null"
          else
            RHYTHM_VALUE="\"$RHYTHM_VALUE\""
          fi

          # Handle 'auto' for speed/complexity - use placeholder that will be replaced
          SPEED_VALUE="$VISUAL_SPEED"
          if [ "$SPEED_VALUE" = "auto" ]; then
            SPEED_VALUE="0.5"  # Placeholder, will be overwritten by art period
          fi

          COMPLEXITY_VALUE="$VISUAL_COMPLEXITY"
          if [ "$COMPLEXITY_VALUE" = "auto" ]; then
            COMPLEXITY_VALUE="0.7"  # Placeholder, will be overwritten by art period
          fi

          # SEO title template - use custom title if provided, otherwise generate SEO-optimized title
          # Per GUARDRAILS.md: titles MUST originate from moods.yaml title_template
          if [ -n "$TITLE_INPUT" ] && [ "$TITLE_INPUT" != "" ]; then
            TITLE_TEMPLATE="$TITLE_INPUT"
          else
            # SEO format: "Intent | Duration | Differentiator"
            # Example: "Focus Music | 1 Hour | Evolving Ambient That Never Repeats"
            TITLE_TEMPLATE="Ambient $ART_PERIOD | {duration_str} | Evolving $MUSIC_STYLE Soundscape"
          fi

          cat > /tmp/art_creator_config.yaml << EOF
          custom_creation:
            description: "Custom artistic creation with $ART_PERIOD visuals and $MUSIC_STYLE audio"
            title_template: "$TITLE_TEMPLATE"
            art_period: "$ART_PERIOD"
            journey: "$JOURNEY"
            journey_intensity: "$JOURNEY_INTENSITY"
            visual:
              type: "$VISUAL_PATTERN"
              speed: $SPEED_VALUE
              complexity: $COMPLEXITY_VALUE
              symmetry: 6
              pulse_frequency: 0.1
              pattern: "mandelbrot"
            audio:
              rhythm: $RHYTHM_VALUE
              rhythm_volume: $RHYTHM_VOLUME
              tempo: $TEMPO
              base_frequency: $BRAINWAVE_FREQ
              binaural_beat: $BRAINWAVE_FREQ
              layers:
                - type: "sine"
                  frequency: $SOLFEGGIO_FREQ
                  amplitude: 0.1
                - type: "binaural"
                  carrier: 200
                  beat: $BRAINWAVE_FREQ
                  amplitude: 0.12
          EOF

          echo "📋 Custom configuration created"
          cat /tmp/art_creator_config.yaml
      
      - name: Apply art period presets and color palette
        env:
          ART_PERIOD: ${{ steps.inputs.outputs.art_period }}
          VISUAL_PATTERN: ${{ steps.inputs.outputs.visual_pattern }}
          VISUAL_SPEED: ${{ steps.inputs.outputs.visual_speed }}
          VISUAL_COMPLEXITY: ${{ steps.inputs.outputs.visual_complexity }}
          TEMPO: ${{ steps.inputs.outputs.tempo }}
          COLOR_PALETTE: ${{ steps.inputs.outputs.color_palette }}
          CUSTOM_PRIMARY: ${{ steps.inputs.outputs.custom_primary_rgb }}
          CUSTOM_SECONDARY: ${{ steps.inputs.outputs.custom_secondary_rgb }}
          CUSTOM_ACCENT: ${{ steps.inputs.outputs.custom_accent_rgb }}
        run: |
          # Apply art period presets (colors, complexity, symmetry, speed, pattern) with optional overrides
          python3 << 'PYTHON_SCRIPT'
          import yaml
          import os
          import sys

          # Art period presets - each defines a complete visual style
          ART_PERIODS = {
              'cave_art': {
                  'colors': {'primary': [80, 50, 30], 'secondary': [120, 90, 60], 'accent': [180, 140, 100]},
                  'complexity': 0.3,    # Simple, primal
                  'symmetry': 2,        # Minimal symmetry
                  'speed': 0.25,        # Very slow, meditative
                  'pattern': 'organic_flow'  # Organic, natural movement
              },
              'ancient': {
                  'colors': {'primary': [180, 140, 20], 'secondary': [220, 180, 40], 'accent': [255, 220, 100]},
                  'complexity': 0.5,    # Structured
                  'symmetry': 4,        # Geometric
                  'speed': 0.35,        # Deliberate
                  'pattern': 'sacred_geometry'  # Egyptian/Greek geometry
              },
              'medieval': {
                  'colors': {'primary': [120, 20, 30], 'secondary': [20, 40, 120], 'accent': [220, 180, 40]},
                  'complexity': 0.65,   # Ornate
                  'symmetry': 8,        # Octagonal (rose windows)
                  'speed': 0.3,         # Slow, reverent
                  'pattern': 'sacred_geometry'  # Cathedral rose windows
              },
              'renaissance': {
                  'colors': {'primary': [140, 100, 70], 'secondary': [180, 120, 80], 'accent': [220, 180, 140]},
                  'complexity': 0.8,    # High detail
                  'symmetry': 6,        # Balanced, harmonious
                  'speed': 0.4,         # Measured
                  'pattern': 'fibonacci_spiral'  # Golden ratio, Da Vinci
              },
              'baroque': {
                  'colors': {'primary': [100, 40, 60], 'secondary': [180, 120, 80], 'accent': [255, 200, 100]},
                  'complexity': 0.85,   # Dramatic detail
                  'symmetry': 6,        # Dynamic balance
                  'speed': 0.55,        # Movement, drama
                  'pattern': 'julia'    # Complex, dramatic swirls
              },
              'impressionist': {
                  'colors': {'primary': [180, 200, 220], 'secondary': [220, 180, 200], 'accent': [255, 240, 200]},
                  'complexity': 0.55,   # Soft edges
                  'symmetry': 3,        # Loose, natural
                  'speed': 0.45,        # Flowing like brushstrokes
                  'pattern': 'flowing_waves'  # Soft, flowing light
              },
              'modern': {
                  'colors': {'primary': [180, 0, 255], 'secondary': [255, 0, 150], 'accent': [0, 255, 200]},
                  'complexity': 0.7,    # Abstract
                  'symmetry': 4,        # Geometric abstraction
                  'speed': 0.5,         # Moderate
                  'pattern': 'geometric_morph'  # Abstract shapes
              },
              'contemporary': {
                  'colors': {'primary': [100, 100, 120], 'secondary': [180, 180, 200], 'accent': [255, 100, 50]},
                  'complexity': 0.75,   # Mixed media feel
                  'symmetry': 5,        # Unconventional
                  'speed': 0.6,         # Dynamic
                  'pattern': 'particle_flow'  # Digital particles
              },
              'future': {
                  'colors': {'primary': [255, 0, 100], 'secondary': [0, 255, 255], 'accent': [255, 100, 255]},
                  'complexity': 0.9,    # High tech
                  'symmetry': 8,        # Complex
                  'speed': 0.7,         # Fast, dynamic
                  'pattern': 'starfield'  # Space, future tech
              }
          }

          # Standalone color palettes (for override)
          PALETTES = {
              'cave_earth': {'primary': [80, 50, 30], 'secondary': [120, 90, 60], 'accent': [180, 140, 100]},
              'ancient_gold': {'primary': [180, 140, 20], 'secondary': [220, 180, 40], 'accent': [255, 220, 100]},
              'medieval_rich': {'primary': [120, 20, 30], 'secondary': [20, 40, 120], 'accent': [220, 180, 40]},
              'renaissance_warm': {'primary': [140, 100, 70], 'secondary': [180, 120, 80], 'accent': [220, 180, 140]},
              'impressionist_soft': {'primary': [180, 200, 220], 'secondary': [220, 180, 200], 'accent': [255, 240, 200]},
              'psychedelic': {'primary': [180, 0, 255], 'secondary': [255, 0, 150], 'accent': [0, 255, 200]},
              'cyberpunk': {'primary': [255, 0, 100], 'secondary': [0, 255, 255], 'accent': [255, 100, 255]},
              'sunset': {'primary': [255, 120, 60], 'secondary': [255, 180, 100], 'accent': [255, 220, 180]},
              'ocean': {'primary': [0, 50, 100], 'secondary': [0, 100, 150], 'accent': [100, 180, 220]},
              'forest': {'primary': [30, 60, 30], 'secondary': [50, 100, 50], 'accent': [100, 150, 80]}
          }

          art_period = os.environ.get('ART_PERIOD', 'modern')
          visual_pattern = os.environ.get('VISUAL_PATTERN', 'auto')
          visual_speed = os.environ.get('VISUAL_SPEED', 'auto')
          visual_complexity = os.environ.get('VISUAL_COMPLEXITY', 'auto')
          tempo = os.environ.get('TEMPO', '60')
          palette = os.environ.get('COLOR_PALETTE', 'auto')

          # Load the config
          with open('/tmp/art_creator_config.yaml', 'r') as f:
              config = yaml.safe_load(f)

          # Get art period preset (defaults to modern)
          period_preset = ART_PERIODS.get(art_period, ART_PERIODS['modern'])

          # Apply art period visual characteristics (with user overrides)
          # Symmetry always comes from art period
          config['custom_creation']['visual']['symmetry'] = period_preset['symmetry']

          # Speed: use user value if not 'auto', otherwise use art period
          if visual_speed != 'auto':
              config['custom_creation']['visual']['speed'] = float(visual_speed)
              print(f"⚡ Using custom speed: {visual_speed}")
          else:
              config['custom_creation']['visual']['speed'] = period_preset['speed']
              print(f"⚡ Using {art_period} period speed: {period_preset['speed']}")

          # Complexity: use user value if not 'auto', otherwise use art period
          if visual_complexity != 'auto':
              config['custom_creation']['visual']['complexity'] = float(visual_complexity)
              print(f"🔧 Using custom complexity: {visual_complexity}")
          else:
              config['custom_creation']['visual']['complexity'] = period_preset['complexity']
              print(f"🔧 Using {art_period} period complexity: {period_preset['complexity']}")

          # Determine pattern: auto uses art period's pattern, otherwise use explicit choice
          if visual_pattern == 'auto':
              pattern = period_preset['pattern']
              print(f"🎭 Using {art_period} period pattern: {pattern}")
          else:
              pattern = visual_pattern
              print(f"🎭 Overriding pattern with: {pattern}")

          config['custom_creation']['visual']['pattern'] = pattern

          # Apply tempo to audio config
          config['custom_creation']['audio']['tempo'] = int(tempo)
          print(f"🎵 Tempo set to: {tempo} BPM")

          print(f"🎭 Applied {art_period} period with final values: complexity={config['custom_creation']['visual']['complexity']}, symmetry={period_preset['symmetry']}, speed={config['custom_creation']['visual']['speed']}, pattern={pattern}")

          # Determine colors
          if palette == 'auto':
              # Use art period's colors
              colors = period_preset['colors']
              print(f"🎨 Using {art_period} period colors (auto)")
          elif palette == 'custom':
              try:
                  primary = [int(x.strip()) for x in os.environ.get('CUSTOM_PRIMARY', '100,150,200').split(',')]
                  secondary = [int(x.strip()) for x in os.environ.get('CUSTOM_SECONDARY', '200,100,150').split(',')]
                  accent = [int(x.strip()) for x in os.environ.get('CUSTOM_ACCENT', '255,255,100').split(',')]

                  for color_name, color in [('primary', primary), ('secondary', secondary), ('accent', accent)]:
                      if len(color) != 3:
                          print(f"❌ Error: {color_name} must have 3 values (R,G,B), got {len(color)}")
                          sys.exit(1)
                      for i, val in enumerate(color):
                          if val < 0 or val > 255:
                              print(f"❌ Error: {color_name}[{i}] must be 0-255, got {val}")
                              sys.exit(1)
                  colors = {'primary': primary, 'secondary': secondary, 'accent': accent}
                  print(f"🎨 Using custom colors")
              except ValueError as e:
                  print(f"❌ Error parsing custom RGB: {e}")
                  sys.exit(1)
          else:
              # Use explicit palette override
              colors = PALETTES.get(palette, period_preset['colors'])
              print(f"🎨 Overriding with {palette} palette")

          config['custom_creation']['visual']['colors'] = colors

          # Save updated config
          with open('/tmp/art_creator_config.yaml', 'w') as f:
              yaml.dump(config, f, default_flow_style=False)

          print(f"   Colors: primary={colors['primary']}, secondary={colors['secondary']}, accent={colors['accent']}")
          PYTHON_SCRIPT
      
      - name: Merge custom config with moods
        run: |
          # Append custom config to moods.yaml temporarily for this run
          cat /tmp/art_creator_config.yaml >> config/moods.yaml
          echo "✅ Custom mood 'custom_creation' added to config"
      
      - name: Generate artistic video
        env:
          DURATION_INPUT: ${{ steps.inputs.outputs.duration }}
          SEED_INPUT: ${{ steps.inputs.outputs.seed }}
          RHYTHM_VOLUME_INPUT: ${{ steps.inputs.outputs.rhythm_volume }}
          AMBIENT_VOLUME_INPUT: ${{ steps.inputs.outputs.ambient_volume }}
          ART_PERIOD_INPUT: ${{ steps.inputs.outputs.art_period }}
          VISUAL_PATTERN_INPUT: ${{ steps.inputs.outputs.visual_pattern }}
          COLOR_PALETTE_INPUT: ${{ steps.inputs.outputs.color_palette }}
          MUSIC_STYLE_INPUT: ${{ steps.inputs.outputs.music_style }}
          TEMPO_INPUT: ${{ steps.inputs.outputs.tempo }}
          BRAINWAVE_FREQ_INPUT: ${{ steps.inputs.outputs.brainwave_frequency }}
          SOLFEGGIO_FREQ_INPUT: ${{ steps.inputs.outputs.solfeggio_frequency }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          CUSTOM_TITLE: ${{ steps.inputs.outputs.title }}
          CUSTOM_DESCRIPTION: ${{ steps.inputs.outputs.description }}
        run: |
          echo "🎨 Creating your unique artistic video..."
          echo "   Art Period: $ART_PERIOD_INPUT"
          echo "   Visual: $VISUAL_PATTERN_INPUT"
          echo "   Colors: $COLOR_PALETTE_INPUT"
          echo "   Music: $MUSIC_STYLE_INPUT"
          echo "   Duration: $DURATION_INPUT"
          
          # Use a Python script to generate with custom parameters
          python3 << 'PYTHON_SCRIPT'
          import sys
          import os
          from orchestrator import Orchestrator
          from pathlib import Path
          
          # Parse duration with error handling
          duration_str = os.environ.get('DURATION_INPUT', '5min')
          try:
              if duration_str.endswith('h'):
                  duration = int(duration_str[:-1]) * 3600
              elif duration_str.endswith('min'):
                  duration = int(duration_str[:-3]) * 60
              elif duration_str.endswith('s'):
                  duration = int(duration_str[:-1])
              else:
                  duration = int(duration_str)
              
              if duration < 5 or duration > 14400:  # Min 5s, Max 4h per GUARDRAILS.md
                  print(f"❌ Error: Duration must be between 5 seconds and 4 hours (per guardrails), got {duration} seconds")
                  sys.exit(1)
          except ValueError as e:
              print(f"❌ Error: Invalid duration format '{duration_str}'. Use formats like: 30s, 5min, 1h")
              sys.exit(1)
          
          # Setup orchestrator
          orchestrator = Orchestrator()
          
          # Parse seed
          seed_str = os.environ.get('SEED_INPUT', '')
          seed = None
          if seed_str:
              try:
                  seed = int(seed_str)
              except ValueError:
                  print(f"❌ Error: Seed must be an integer, got '{seed_str}'")
                  sys.exit(1)
          
          # Parse volumes
          try:
              rhythm_vol = float(os.environ.get('RHYTHM_VOLUME_INPUT', '0.5'))
              ambient_vol = float(os.environ.get('AMBIENT_VOLUME_INPUT', '1.0'))
          except ValueError as e:
              print(f"❌ Error parsing volumes: {e}")
              sys.exit(1)
          
          # Generate
          output_dir = "./art_output"
          Path(output_dir).mkdir(exist_ok=True)
          
          try:
              result = orchestrator.generate(
                  mood='custom_creation',
                  duration=duration,
                  output_dir=output_dir,
                  rhythm_volume=rhythm_vol,
                  drone_volume=ambient_vol,
                  seed=seed
              )
              
              print(f"✨ Video created: {result['video_path']}")
              
              # Save metadata
              import json
              creation_info = {
                  'art_period': os.environ.get('ART_PERIOD_INPUT', ''),
                  'visual_pattern': os.environ.get('VISUAL_PATTERN_INPUT', ''),
                  'color_palette': os.environ.get('COLOR_PALETTE_INPUT', ''),
                  'music_style': os.environ.get('MUSIC_STYLE_INPUT', ''),
                  'tempo': os.environ.get('TEMPO_INPUT', ''),
                  'brainwave_hz': os.environ.get('BRAINWAVE_FREQ_INPUT', ''),
                  'solfeggio_hz': os.environ.get('SOLFEGGIO_FREQ_INPUT', ''),
                  'seed': result['metadata'].get('seed'),
                  'created_by': os.environ.get('GITHUB_ACTOR_NAME', ''),
                  'result': {
                      'video': result['video_path'],
                      'thumbnail': result['thumbnail_path'],
                      'metadata': result['metadata_path']
                  }
              }
              
              with open(f"{output_dir}/creation_info.json", 'w') as f:
                  json.dump(creation_info, f, indent=2)

              # Metadata is generated by orchestrator via title_template in custom_creation config
              # Per GUARDRAILS.md: "All metadata MUST originate from moods.yaml → metadata.json"
              # The orchestrator writes {video_stem}.json with video_title, mood, duration_str, etc.
              print(f"📝 Metadata: {result['metadata_path']}")

          except Exception as e:
              print(f"❌ Error during video generation: {type(e).__name__}: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
          PYTHON_SCRIPT
      
      - name: Upload artwork as artifact
        if: ${{ inputs.skip_artifact_upload != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: artistic-creation-${{ github.run_number }}-${{ steps.inputs.outputs.test_id || 'manual' }}
          path: ./art_output/
          retention-days: 30
      
      - name: Creation Summary
        env:
          ART_PERIOD: ${{ steps.inputs.outputs.art_period }}
          VISUAL_PATTERN: ${{ steps.inputs.outputs.visual_pattern }}
          VISUAL_SPEED: ${{ steps.inputs.outputs.visual_speed }}
          VISUAL_COMPLEXITY: ${{ steps.inputs.outputs.visual_complexity }}
          COLOR_PALETTE: ${{ steps.inputs.outputs.color_palette }}
          MUSIC_STYLE: ${{ steps.inputs.outputs.music_style }}
          TEMPO: ${{ steps.inputs.outputs.tempo }}
          BRAINWAVE_FREQ: ${{ steps.inputs.outputs.brainwave_frequency }}
          SOLFEGGIO_FREQ: ${{ steps.inputs.outputs.solfeggio_frequency }}
          RHYTHM_VOLUME: ${{ steps.inputs.outputs.rhythm_volume }}
          DURATION: ${{ steps.inputs.outputs.duration }}
          SEED: ${{ steps.inputs.outputs.seed }}
          JOURNEY: ${{ steps.inputs.outputs.journey }}
          JOURNEY_INTENSITY: ${{ steps.inputs.outputs.journey_intensity }}
        run: |
          echo "## 🎨 Artistic Creation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Your unique creation is ready!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎭 Your Artistic Choices:" >> $GITHUB_STEP_SUMMARY
          echo "- **Art Period**: $ART_PERIOD" >> $GITHUB_STEP_SUMMARY
          echo "- **Visual Pattern**: $VISUAL_PATTERN" >> $GITHUB_STEP_SUMMARY
          echo "- **Visual Speed**: $VISUAL_SPEED" >> $GITHUB_STEP_SUMMARY
          echo "- **Complexity**: $VISUAL_COMPLEXITY" >> $GITHUB_STEP_SUMMARY
          echo "- **Color Palette**: $COLOR_PALETTE" >> $GITHUB_STEP_SUMMARY
          echo "- **Journey**: $JOURNEY ($JOURNEY_INTENSITY)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎵 Audio Configuration:" >> $GITHUB_STEP_SUMMARY
          echo "- **Music Style**: $MUSIC_STYLE" >> $GITHUB_STEP_SUMMARY
          echo "- **Tempo**: $TEMPO BPM" >> $GITHUB_STEP_SUMMARY
          echo "- **Brainwave**: $BRAINWAVE_FREQ Hz" >> $GITHUB_STEP_SUMMARY
          echo "- **Solfeggio**: $SOLFEGGIO_FREQ Hz" >> $GITHUB_STEP_SUMMARY
          echo "- **Rhythm Volume**: $RHYTHM_VOLUME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Output:" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration**: $DURATION" >> $GITHUB_STEP_SUMMARY

          if [ -n "$SEED" ]; then
            echo "- **Seed**: $SEED (reproducible)" >> $GITHUB_STEP_SUMMARY
          else
            # Extract seed from creation_info.json if available
            if [ -f ./art_output/creation_info.json ]; then
              SEED_VAL=$(python3 -c "import json; print(json.load(open('./art_output/creation_info.json'))['seed'])" 2>/dev/null || echo "auto-generated")
              echo "- **Seed**: ${SEED_VAL} (save this to recreate)" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "- **Created by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Like an artist with their palette, you've created something unique.*" >> $GITHUB_STEP_SUMMARY
          echo "*Each combination of parameters produces a one-of-a-kind creation.*" >> $GITHUB_STEP_SUMMARY
          echo "*The thrill is in the creative process itself, not the expectation of the result.*" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 **Tip**: Use the seed value to recreate this exact video, or try new parameters for a completely different experience!" >> $GITHUB_STEP_SUMMARY
  
  # Job 2: Upload to YouTube (Brand Channel)
  # Runs when upload_to_brand is true (from workflow_dispatch OR workflow_call)
  upload:
    needs: create_art
    runs-on: ubuntu-latest
    # Use inputs.upload_to_brand for workflow_call, github.event.inputs for workflow_dispatch
    # inputs.upload_to_brand is set for workflow_call; github.event.inputs.upload_to_brand for dispatch
    if: ${{ inputs.upload_to_brand == true || inputs.upload_to_brand == 'true' || fromJSON(github.event.inputs.upload_to_brand || 'false') }}
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth-oauthlib google-api-python-client
      
      - name: Download artwork artifacts
        uses: actions/download-artifact@v4
        with:
          name: artistic-creation-${{ github.run_number }}-${{ inputs.test_id || 'manual' }}
          path: ./art_output
      
      - name: Restore YouTube credentials (Brand Channel)
        run: |
          printf "%s" "${{ secrets.YOUTUBE_TOKEN_PICKLE_BRAND }}" | base64 -d > youtube_token.pickle
          printf "%s" '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > client_secrets.json
      
      - name: Upload to YouTube (Brand Channel)
        run: |
          # Upload using youtube_upload.py with metadata.json
          # Spec: docs/spec/workflows.md § Metadata Consistency Rule
          # Contract: docs/spec/contracts/orchestrator-youtube.md § Workflow Integration

          VIDEO_FILE=$(ls ./art_output/*.mp4 2>/dev/null | head -1)
          if [ -z "$VIDEO_FILE" ]; then
            echo "❌ No video files found in art_output"
            exit 1
          fi

          echo "📹 Found video: $VIDEO_FILE"
          echo "📝 Metadata: ${VIDEO_FILE%.mp4}.json"

          # youtube_upload.py reads metadata from <video>.json automatically
          python youtube_upload.py -v "$VIDEO_FILE" --no-update-catalog

          # Copy upload result for summary step
          if [ -f "./art_output/youtube_upload.json" ]; then
            echo "✅ Upload result saved"
          fi
      
      - name: Cleanup credentials
        if: always()
        run: |
          rm -f youtube_token.pickle client_secrets.json

      - name: Commit generations ledger
        run: |
          git config user.name "Art Creator Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/generations.json ]; then
            git add data/generations.json
          fi
          if git diff --staged --quiet; then
            echo "No generations ledger changes to commit"
          else
            git commit -m "🧾 Update generations ledger (art creator) [automated]"
            git push
            echo "✅ generations.json committed and pushed"
          fi

      - name: Upload summary
        run: |
          echo "## ✅ YouTube Upload Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f ./art_output/youtube_upload.json ]; then
            VIDEO_URL=$(python3 -c "import json; print(json.load(open('./art_output/youtube_upload.json'))['url'])" 2>/dev/null || echo "N/A")
            echo "**Channel:** Living Ambient Engine (Brand)" >> $GITHUB_STEP_SUMMARY
            echo "**Video URL:** ${VIDEO_URL}" >> $GITHUB_STEP_SUMMARY
          fi
