# Test Art Creator - All Input Combinations
# This workflow triggers art-creator.yml with its matrix strategy
# to test all combinations of art periods, patterns, music styles, and journeys
# Spec: docs/spec/workflows.md#test-art-creatoryml

name: Test Art Creator - All Combinations

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running tests (optional)'
        required: false
        default: 'Manual test run'

  pull_request:
    paths:
      # Any workflow change can affect upload/generation paths — keep PR gate in sync with YAML.
      - '.github/workflows/**'
      - 'audio/**'
      - 'visuals/**'
      - 'orchestrator/**'
      - 'config/**'
      - 'render/**'
      - 'youtube_upload.py'
      - 'youtube/**'
      - 'scripts/**'
      - 'tests/contracts/**'
      - 'tests/test_agent_dual_advisory.py'
      - 'docs/spec/**'

# workflow_call into art-creator.yml must allow that workflow's job permissions.
# art-creator "upload" uses contents:write; GitHub validates this even when upload is skipped (e.g. tests).
permissions:
  contents: write
  actions: read

jobs:
  # Validate specs are complete and consistent
  spec-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate spec structure
        run: |
          echo "🔍 Checking spec structure..."

          # Check required spec files exist
          REQUIRED_SPECS=(
            "docs/spec/SYSTEM.md"
            "docs/spec/GUARDRAILS.md"
            "docs/spec/contracts/orchestrator-audio.md"
            "docs/spec/contracts/orchestrator-visual.md"
            "docs/spec/contracts/orchestrator-youtube.md"
            "audio/SPEC.md"
            "visuals/SPEC.md"
          )

          MISSING=0
          for spec in "${REQUIRED_SPECS[@]}"; do
            if [ ! -f "$spec" ]; then
              echo "❌ Missing: $spec"
              MISSING=1
            else
              echo "✅ Found: $spec"
            fi
          done

          if [ $MISSING -eq 1 ]; then
            echo "::error::Required spec files are missing"
            exit 1
          fi

      - name: Validate contracts have required sections
        run: |
          echo "🔍 Checking contract sections..."

          CONTRACTS=(
            "docs/spec/contracts/orchestrator-audio.md"
            "docs/spec/contracts/orchestrator-visual.md"
            "docs/spec/contracts/orchestrator-youtube.md"
          )

          REQUIRED_SECTIONS=("Pre-Conditions" "Post-Conditions" "Invariants" "Error Handling")

          ERRORS=0
          for contract in "${CONTRACTS[@]}"; do
            echo "Checking $contract..."
            for section in "${REQUIRED_SECTIONS[@]}"; do
              if ! grep -q "## $section" "$contract"; then
                echo "❌ Missing section '$section' in $contract"
                ERRORS=1
              fi
            done
          done

          if [ $ERRORS -eq 1 ]; then
            echo "::error::Contracts are missing required sections"
            exit 1
          fi
          echo "✅ All contracts have required sections"

      - name: Validate GUARDRAILS.md has parameter limits
        run: |
          echo "🔍 Checking GUARDRAILS.md..."

          GUARDRAILS="docs/spec/GUARDRAILS.md"
          REQUIRED_PARAMS=("tempo" "speed" "complexity" "duration" "volume")

          ERRORS=0
          for param in "${REQUIRED_PARAMS[@]}"; do
            if ! grep -qi "$param" "$GUARDRAILS"; then
              echo "❌ Missing parameter '$param' in GUARDRAILS.md"
              ERRORS=1
            fi
          done

          if [ $ERRORS -eq 1 ]; then
            echo "::error::GUARDRAILS.md is missing required parameters"
            exit 1
          fi
          echo "✅ GUARDRAILS.md has all required parameters"

      - name: Validate art-creator.yml concurrency allows parallel tests
        run: |
          echo "🔍 Checking concurrency group includes test_id..."

          WORKFLOW=".github/workflows/art-creator.yml"

          # Concurrency group must include test_id for parallel matrix jobs
          if ! grep -q 'group:.*test_id' "$WORKFLOW"; then
            echo "❌ Concurrency group must include test_id for parallel test execution"
            echo "::error::art-creator.yml concurrency group missing test_id (see GUARDRAILS.md)"
            exit 1
          fi
          echo "✅ Concurrency group includes test_id for parallel tests"

      - name: Validate guardrails have contract tests
        run: |
          echo "🔍 Checking guardrail↔contract alignment..."
          echo "See: docs/spec/ENFORCEMENT.md - Layer 2 requires contract tests for guardrails"

          ERRORS=0

          # Memory guardrail (GUARDRAILS.md line 96) must have contract test
          if ! grep -q "test_memory_guardrail" tests/contracts/test_audio_contract.py; then
            echo "❌ Missing contract test for memory guardrail (GUARDRAILS.md: 'Memory usage > 8GB')"
            echo "::error::Memory guardrail has no contract test - add test_memory_guardrail_enforced"
            ERRORS=1
          else
            echo "✅ Memory guardrail has contract test"
          fi

          # Concurrency guardrail has validation step above (not a pytest test)
          echo "✅ Concurrency guardrail validated in previous step"

          # Metadata consistency guardrail must have contract test
          if ! grep -q "test_no_inline_metadata_generation" tests/contracts/test_workflow_metadata_consistency.py 2>/dev/null; then
            echo "❌ Missing contract test for metadata consistency guardrail"
            echo "::error::Metadata consistency guardrail has no contract test"
            ERRORS=1
          else
            echo "✅ Metadata consistency guardrail has contract test"
          fi

          if [ $ERRORS -eq 1 ]; then
            echo ""
            echo "::error::Guardrails without contract tests detected. See ENFORCEMENT.md Layer 2."
            exit 1
          fi

          echo "✅ All guardrails have contract tests"

  # Run contract and validation tests (fast)
  contract-tests:
    needs: spec-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest jsonschema

      - name: Run contract tests (validation only - fast)
        run: |
          # Run validation + workflow metadata consistency tests (fast)
          # Dual-advisory unit tests: pure Python, no cv2/soundfile (see tests/ layout)
          # Generator tests are slow and run via matrix
          python -m pytest \
            tests/contracts/test_validation_contract.py \
            tests/contracts/test_workflow_metadata_consistency.py \
            tests/test_agent_dual_advisory.py \
            -v --tb=short

  # Run art-creator matrix tests (slower, needs contract tests to pass)
  # Matrix strategy calls art-creator.yml 7 times with different input combinations
  call-art-creator:
    needs: contract-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test 1: Cave art with awakening journey
          - test_id: '1'
            art_period: 'cave_art'
            visual_pattern: 'organic_flow'
            music_style: 'heartbeat'
            journey: 'awakening'
            journey_intensity: 'subtle'
          # Test 2: Renaissance with breathing journey
          - test_id: '2'
            art_period: 'renaissance'
            visual_pattern: 'fibonacci_spiral'
            music_style: 'gnawa'
            journey: 'breathing'
            journey_intensity: 'moderate'
          # Test 3: Modern with trance journey
          - test_id: '3'
            art_period: 'modern'
            visual_pattern: 'geometric_morph'
            music_style: 'gamelan'
            journey: 'trance'
            journey_intensity: 'dramatic'
          # Test 4: Future with deep_dive journey
          - test_id: '4'
            art_period: 'future'
            visual_pattern: 'starfield'
            music_style: 'none'
            journey: 'deep_dive'
            journey_intensity: 'moderate'
          # Test 5: Impressionist with waves journey
          - test_id: '5'
            art_period: 'impressionist'
            visual_pattern: 'flowing_waves'
            music_style: 'candomble'
            journey: 'waves'
            journey_intensity: 'subtle'
          # Test 6: Baroque with crescendo journey
          - test_id: '6'
            art_period: 'baroque'
            visual_pattern: 'julia'
            music_style: 'taiko'
            journey: 'crescendo'
            journey_intensity: 'dramatic'
          # Test 7: Medieval with steady journey
          - test_id: '7'
            art_period: 'medieval'
            visual_pattern: 'sacred_geometry'
            music_style: 'burundi'
            journey: 'steady'
            journey_intensity: 'moderate'
    uses: ./.github/workflows/art-creator.yml
    with:
      art_period: ${{ matrix.art_period }}
      visual_pattern: ${{ matrix.visual_pattern }}
      music_style: ${{ matrix.music_style }}
      journey: ${{ matrix.journey }}
      journey_intensity: ${{ matrix.journey_intensity }}
      duration: '5s'  # Minimum per GUARDRAILS.md - fast test validation
      test_id: ${{ matrix.test_id }}
      skip_artifact_upload: 'true'  # Tests don't need artifacts saved
    secrets: inherit
