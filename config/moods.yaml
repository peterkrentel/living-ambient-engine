  rhythm_origin: "Nature - no tribal drums, pure rain"
  visual:
    type: "rain_window"
    colors:
      primary: [10, 15, 30]       # Dark blue night
      primary_variation: [5, 5, 10]  # +/- color variation
      secondary: [20, 30, 50]     # Lighter blue
      secondary_variation: [10, 10, 15]
      accent: [100, 120, 180]     # Rain drop blue
      accent_variation: [20, 20, 30]
    pattern: "rain_window"
    speed: 0.2
    speed_variation: 0.1          # 0.1 to 0.3
    complexity: 0.5
    complexity_variation: 0.2     # 0.3 to 0.7
    symmetry: 1
    pulse_frequency: 0.02
    pulse_frequency_variation: 0.01
  audio:
    rhythm: null                  # No drums for rain
    rhythm_volume: 0
    base_frequency: 2             # Delta waves (deep sleep)
    base_frequency_variation: 0.5 # 1.5 to 2.5 Hz
    binaural_beat: 2
    binaural_beat_variation: 0.5
    layers:
      - type: "rain"
        drop_rate: 80             # Heavy rain
        drop_rate_variation: 30   # 50 to 110 drops/sec
        amplitude: 0.6
        amplitude_variation: 0.15
      - type: "binaural"
        carrier: 100
