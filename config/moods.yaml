# Mood presets for Living Ambient Engine
# Each mood defines visual and audio parameters for hypnotic content generation
# Audio now features authentic tribal rhythms for deep trance induction

deep_focus:
  description: "Deep concentration and flow state - Gnawa trance rhythm"
  title_template: "Deep Focus | {rhythm_name} Tribal Beats | {duration_str} Concentration Music"
  rhythm_origin: "Moroccan Gnawa - spiritual trance music for healing"
  visual:
    type: "sacred_geometry"
    colors:
      primary: [20, 30, 80]      # Deep blue
      secondary: [80, 40, 120]   # Purple
      accent: [100, 200, 255]    # Light blue
    pattern: "fibonacci_spiral"
    speed: 0.3                    # Slow movement
    complexity: 0.7               # Medium-high detail
    symmetry: 6                   # Hexagonal
    pulse_frequency: 0.1          # Gentle pulsing
  audio:
    rhythm: "gnawa"               # Moroccan trance rhythm
    rhythm_volume: 0.6            # Drums prominent
    base_frequency: 40            # Gamma waves (focus)
    binaural_beat: 40             # 40 Hz (concentration)
    layers:
      - type: "sine"
        frequency: 432            # A=432Hz (natural tuning)
        amplitude: 0.12           # Reduced drone
      - type: "pink_noise"
        amplitude: 0.05
      - type: "binaural"
        carrier: 200
        beat: 40
        amplitude: 0.15           # Subtle binaural

sleep:
  description: "Deep relaxation and sleep induction - Heartbeat rhythm"
  title_template: "Sleep & Dreams | {rhythm_name} Healing Rhythm | {duration_str} Deep Rest"
  rhythm_origin: "Universal Heartbeat - primal rhythm synced to the body"
  visual:
    type: "flowing_waves"
    colors:
      primary: [10, 10, 30]       # Very dark blue
      secondary: [30, 20, 50]     # Dark purple
      accent: [50, 40, 80]        # Muted purple
    pattern: "slow_waves"
    speed: 0.1                    # Very slow
    complexity: 0.3               # Low detail
    symmetry: 0                   # Organic flow
    pulse_frequency: 0.05         # Very slow pulse
  audio:
    rhythm: "heartbeat"           # Primal heartbeat
    rhythm_volume: 0.5            # Heartbeat prominent
    base_frequency: 2             # Delta waves (0.5-4Hz = deep sleep)
    binaural_beat: 2              # 2Hz Delta - deepest sleep state
    layers:
      - type: "sine"
        frequency: 528            # 528Hz "Love/Miracle" frequency - healing/DNA repair
        amplitude: 0.12
      - type: "sine"
        frequency: 174            # 174Hz - pain relief, grounding
        amplitude: 0.08
      - type: "pink_noise"
        amplitude: 0.08
      - type: "binaural"
        carrier: 108              # Low carrier for gentler sound
        beat: 2                   # 2Hz Delta entrainment
        amplitude: 0.15

