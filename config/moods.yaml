deep_focus:
  description: "Deep concentration and flow state - Hypnotic fractal journey"
  title_template: "Enter Flow State | {duration_str} Zero Distraction Focus | Continuous"
  description_template: |
    🎯 Created to quiet an overactive mind and unlock deep concentration.
    ✨ This soundscape evolves through phases and never repeats.
    Best for: deep work, coding, writing, any task requiring flow.

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    ⏱️ Duration: {duration_str}
    🥁 Rhythm: {rhythm_name}
    🌍 {rhythm_origin}

    🧠 Uses binaural beats & Solfeggio frequencies for brainwave entrainment.

    🔔 Subscribe for weekly long-form ambient
    👍 Like if this helps you focus

    #AmbientMusic #BinauralBeats #Focus #DeepWork #StudyMusic #Concentration
  tags:
    - "focus music"
    - "deep work music"
    - "concentration music"
    - "binaural beats focus"
    - "study music"
    - "work music"
    - "ambient focus"
    - "coding music"
    - "flow state music"
    - "productivity music"
    - "background music for work"
    - "music for concentration"
    - "gnawa rhythm"
    - "tribal drums focus"
    - "432 hz music"
    - "ASMR"
  rhythm_origin: "Moroccan Gnawa - spiritual trance music for healing"
  visual:
    type: "fractal_zoom"
    colors:
      primary: [0, 100, 180]      # Electric blue (trust, focus)
      secondary: [120, 50, 200]   # Violet (creativity, calm)
      accent: [0, 220, 255]       # Cyan glow (clarity)
    pattern: "mandelbrot"
    speed: 0.5                    # Smooth zoom
    speed_variation: 0.15         # 0.35 to 0.65
    complexity: 0.85              # High detail fractals
    complexity_variation: 0.1     # 0.75 to 0.95
    symmetry: 8                   # Octagonal
    pulse_frequency: 0.08         # Subtle breathing pulse
    pulse_frequency_variation: 0.02  # 0.06 to 0.10
  audio:
    rhythm: "gnawa"               # Moroccan trance rhythm
    rhythm_volume: 0.5            # Balanced drums
    rhythm_volume_variation: 0.1  # 0.4 to 0.6
    base_frequency: 40            # Gamma waves (focus)
    base_frequency_variation: 5   # 35 to 45 Hz
    binaural_beat: 40             # 40 Hz (concentration)
    binaural_beat_variation: 5    # 35 to 45 Hz
    layers:
      - type: "sine"
        frequency: 432            # A=432Hz (natural tuning)
        amplitude: 0.1
        amplitude_variation: 0.02
      - type: "melody"
        scale: "pentatonic_minor"
        root: 220                 # A3
        tempo: 60                 # Slow, hypnotic
        tempo_variation: 10       # 50 to 70 BPM
        amplitude: 0.15
        amplitude_variation: 0.03
      - type: "pad"
        frequency: 110            # A2 pad
        amplitude: 0.08
        amplitude_variation: 0.02
      - type: "binaural"
        carrier: 200
        carrier_variation: 20     # 180 to 220 Hz
        beat: 40
        amplitude: 0.12
        amplitude_variation: 0.02

