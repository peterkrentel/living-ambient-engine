# Mood presets for Living Ambient Engine
# Each mood defines visual and audio parameters for hypnotic content generation
# Audio now features authentic tribal rhythms for deep trance induction

deep_focus:
  description: "Deep concentration and flow state - Hypnotic fractal journey"
  title_template: "Deep Focus | Fractal Flow | {duration_str} Concentration Music"
  rhythm_origin: "Moroccan Gnawa - spiritual trance music for healing"
  visual:
    type: "fractal_zoom"
    colors:
      primary: [0, 100, 180]      # Electric blue (trust, focus)
      secondary: [120, 50, 200]   # Violet (creativity, calm)
      accent: [0, 220, 255]       # Cyan glow (clarity)
    pattern: "mandelbrot"
    speed: 0.5                    # Smooth zoom
    complexity: 0.85              # High detail fractals
    symmetry: 8                   # Octagonal
    pulse_frequency: 0.08         # Subtle breathing pulse
  audio:
    rhythm: "gnawa"               # Moroccan trance rhythm
    rhythm_volume: 0.5            # Balanced drums
    base_frequency: 40            # Gamma waves (focus)
    binaural_beat: 40             # 40 Hz (concentration)
    layers:
      - type: "sine"
        frequency: 432            # A=432Hz (natural tuning)
        amplitude: 0.1
      - type: "melody"
        scale: "pentatonic_minor"
        root: 220                 # A3
        tempo: 60                 # Slow, hypnotic
        amplitude: 0.15
      - type: "pad"
        frequency: 110            # A2 pad
        amplitude: 0.08
      - type: "binaural"
        carrier: 200
        beat: 40
        amplitude: 0.12

sleep:
  description: "Deep relaxation and sleep induction - Gentle fractal drift"
  title_template: "Sleep & Dreams | Fractal Lullaby | {duration_str} Deep Rest"
  rhythm_origin: "Universal Heartbeat - primal rhythm synced to the body"
  visual:
    type: "fractal_zoom"
    colors:
      primary: [20, 10, 50]       # Deep indigo (calm, sleep)
      secondary: [60, 30, 90]     # Soft purple (dreams)
      accent: [100, 80, 140]      # Lavender glow (peace)
    pattern: "julia"              # Softer, dreamier fractals
    speed: 0.2                    # Very slow drift
    complexity: 0.6               # Medium detail, not overwhelming
    symmetry: 6                   # Hexagonal harmony
    pulse_frequency: 0.03         # Very slow breathing
  audio:
    rhythm: "heartbeat"           # Primal heartbeat
    rhythm_volume: 0.35           # Subtle heartbeat
    base_frequency: 2             # Delta waves (deep sleep)
    binaural_beat: 2              # 2Hz Delta
    layers:
      - type: "sine"
        frequency: 528            # 528Hz healing frequency
        amplitude: 0.1
      - type: "melody"
        scale: "pentatonic_major"
        root: 174                 # Low, grounding
        tempo: 40                 # Very slow lullaby
        amplitude: 0.12
      - type: "pad"
        frequency: 87             # F2 - warm low pad
        amplitude: 0.1
      - type: "pink_noise"
        amplitude: 0.06
      - type: "binaural"
        carrier: 108
        beat: 2
        amplitude: 0.1

